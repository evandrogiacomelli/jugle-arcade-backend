
services:
  postgres:
    image: postgres:17-alpine
    container_name: jungle-arcade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jungle_arcade
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle_arcade"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
